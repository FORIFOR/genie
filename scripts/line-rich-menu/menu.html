<!doctype html>
<!--
  LINE のリッチメニューの画像（2500×843）。scripts/line-rich-menu.mjs render で menu.png にする。
  ボタンの並び・文は services/channels/src/rich-menu.ts と同じ（仕事・電話・予定・使い方）。
  色は LINE の答えのカード（cards.ts）と同じ暗い面。
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  :root { --bg:#1C1C1E; --rule:#3A3A3C; --text:#FFFFFF; --muted:#AEAEB2; --accent:#8AB4F8; }
  html, body { margin:0; width:2500px; height:843px; background:var(--bg); overflow:hidden; }
  body { display:grid; grid-template-columns:repeat(4, 625px); font-family:"Hiragino Sans", -apple-system, sans-serif; }
  .cell { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:30px;
          border-left:3px solid var(--rule); box-sizing:border-box; }
  .cell:first-child { border-left:0; }
  svg { width:170px; height:170px; fill:none; stroke:var(--accent); stroke-width:11; stroke-linecap:round; stroke-linejoin:round; }
  .label { color:var(--text); font-size:116px; font-weight:700; line-height:1; letter-spacing:.04em; }
  .hint { color:var(--muted); font-size:64px; font-weight:600; line-height:1.2; }
</style>
</head>
<body>
  <div class="cell">
    <svg viewBox="0 0 100 100"><rect x="18" y="14" width="64" height="76" rx="9"/><path d="M33 40l7 7 13-14M33 66h34"/></svg>
    <div class="label">仕事</div><div class="hint">状況とホーム</div>
  </div>
  <div class="cell">
    <svg viewBox="0 0 100 100"><path d="M30 14c5 0 9 12 10 18 1 5-6 8-6 12 2 9 11 20 22 23 4 0 7-7 12-6 6 1 18 5 18 10 0 8-8 17-17 17C42 88 12 58 12 31c0-9 9-17 18-17z"/></svg>
    <div class="label">電話</div><div class="hint">Genie と声で話す</div>
  </div>
  <div class="cell">
    <svg viewBox="0 0 100 100"><rect x="14" y="20" width="72" height="68" rx="9"/><path d="M14 40h72M33 12v16M67 12v16M32 58h10M58 58h10M32 73h10"/></svg>
    <div class="label">予定</div><div class="hint">今日の予定</div>
  </div>
  <div class="cell">
    <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="38"/><path d="M38 39c0-8 6-13 13-13 7 0 12 5 12 11 0 9-12 10-12 19"/><path d="M51 71v1"/></svg>
    <div class="label">使い方</div><div class="hint">できること</div>
  </div>
</body>
</html>
