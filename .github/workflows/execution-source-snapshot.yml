name: execution-source-snapshot
on:
  push:
    branches: [feat/taskdock-verified-execution]
    paths: ['.github/workflows/execution-source-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked implementation sources only
        run: |
          git ls-files -z -- AGENTS.md '*.json' '*.yaml' '*.yml' .prettierignore .env.example apps/genie-macos services workers packages plugins shared/design scripts .github docs/DESIGN_SYSTEM.md > /tmp/source-paths
          tar --null -czf execution-sources.tar.gz -T /tmp/source-paths
      - uses: actions/upload-artifact@v4
        with:
          name: execution-sources
          path: execution-sources.tar.gz
          retention-days: 1
          if-no-files-found: error
