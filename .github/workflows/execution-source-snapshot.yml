name: execution-source-snapshot
on:
  push:
    branches: [feat/taskdock-verified-execution]
    paths: ['.github/workflows/execution-source-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Archive installed dependencies and declarations only
        run: |
          find . -type d -name node_modules -prune -print0 > /tmp/dependency-paths
          find packages services workers -type d -name dist -prune -print0 >> /tmp/dependency-paths
          tar --null -czf execution-dependencies.tar.gz -T /tmp/dependency-paths
      - uses: actions/upload-artifact@v4
        with:
          name: execution-dependencies
          path: execution-dependencies.tar.gz
          retention-days: 1
          if-no-files-found: error
