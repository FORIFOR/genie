name: Prepare owned guide links
on:
  push:
    branches: [docs/reachmade-site-migration-20260919]
    paths: [.github/workflows/owned-guide-links.yml]
permissions:
  contents: write
jobs:
  links:
    if: github.ref == 'refs/heads/docs/reachmade-site-migration-20260919'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref }}
      - name: Update only active onboarding guide URLs
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          from urllib.parse import urlsplit
          host='https://genie-forifor.forifor.chatgpt.site'
          pattern=re.compile(re.escape(host)+r'[^\s)\]"<>`]*')
          files=['docs/TESTING.md','docs/TESTING.ja.md','docs/LOCAL_PREVIEW.md','docs/LOCAL_PREVIEW.ja.md','docs/MANAGED_PREVIEW.md','CONTRIBUTING.md']
          for name in files:
              p=Path(name)
              if not p.exists():continue
              old=p.read_text();prefix='' if name.endswith('.ja.md') else '/en'
              def route(match):
                  u=urlsplit(match.group());base='https://reachmade.com'+prefix+'/products/genie/'
                  if u.path.startswith('/assets/') or u.path in ['/orbit','/orbit.html']:
                      return 'https://reachmade.com/media/originals/genie'+('/orbit.html' if u.path=='/orbit' else u.path)
                  if u.fragment in ['demo','demos','proposal','priorities','prototype']:
                      return base+'demos/#'+({'demo':'prototype','demos':'prototype'}.get(u.fragment,u.fragment))
                  if u.fragment=='business':return 'https://reachmade.com'+prefix+'/contact/'
                  return base
              new=pattern.sub(route,old)
              assert len(new)>len(old)*.95
              if old!=new:p.write_text(new);print(name)
          PY
          git diff --check
          git diff --stat
      - name: Commit only guide changes
        run: |
          git add docs/TESTING.md docs/TESTING.ja.md docs/LOCAL_PREVIEW.md docs/LOCAL_PREVIEW.ja.md docs/MANAGED_PREVIEW.md CONTRIBUTING.md
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Keep active Genie setup and tester guides on the owned site'
            git push origin HEAD:refs/heads/docs/reachmade-site-migration-20260919
          fi
