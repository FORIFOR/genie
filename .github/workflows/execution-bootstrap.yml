name: execution-bootstrap
on:
  push:
    branches: [feat/taskdock-verified-execution]
    paths: ['.github/execution-pack/**', '.github/workflows/execution-bootstrap.yml']
permissions:
  contents: write
concurrency:
  group: execution-bootstrap
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'FORIFOR/genie' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Apply digest-checked locally tested source
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, lzma, subprocess, json
          from pathlib import Path
          data = b''.join(Path(f'.github/execution-pack/part{i}').read_bytes() for i in range(4))
          assert hashlib.sha256(data).hexdigest() == '34f71a1b5fa04f620023b977a0aadf3978323330a8aa2d48b2193c69d259b4ef'
          patch = lzma.decompress(data)
          assert len(patch) == 137107
          names = [line.split(' b/', 1)[1] for line in patch.decode().splitlines() if line.startswith('diff --git ')]
          assert len(names) == 45 and len(set(names)) == 45
          for name in names:
              assert not Path(name).is_absolute() and '..' not in Path(name).parts
              assert name in {'.env.example','pnpm-lock.yaml'} or name.startswith(('apps/genie-macos/','services/','workers/','tools/execution/','scripts/','docs/VERIFIED_EXECUTION.md'))
          subprocess.run(['git','apply','--check','-'], input=patch, check=True)
          subprocess.run(['git','apply','-'], input=patch, check=True)
          Path('/tmp/execution-stage.json').write_text(json.dumps(names))
          print('45 authored source paths applied; no workflow changes in source bundle.')
          PY
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec tsc -p tsconfig.tests.json
      - name: Validate execution and existing host regressions
        run: pnpm exec vitest run workers/agent-host/test services/connectors/test services/conversation/test services/task/test/execution-plan.test.ts services/task/test/metered-workflow.test.ts services/task/test/mail-plan.test.ts
      - name: Publish checked readable source to feature branch only
        env:
          GH_WRITE_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          names = json.loads(Path('/tmp/execution-stage.json').read_text())
          subprocess.run(['git','add','--',*names], check=True)
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: connect TaskDock intents to approved execution and verified receipts'
          AUTH=$(printf 'x-access-token:%s' "$GH_WRITE_TOKEN" | base64 | tr -d '\n')
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:feat/taskdock-verified-execution
